<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienes una invitación especial 💕</title>
    <!-- Tailwind CSS para estilos modernos y responsivos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Poppins para máxima legibilidad, claridad y modernidad -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Poppins"', 'sans-serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'heartbeat': 'heartbeat 1.5s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
                            '50%': { transform: 'translateY(-15px) rotate(5deg)' },
                        },
                        heartbeat: {
                            '0%, 100%': { transform: 'scale(1)' },
                            '25%': { transform: 'scale(1.06)' },
                            '40%': { transform: 'scale(0.98)' },
                            '60%': { transform: 'scale(1.03)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Fondo degradado cálido y romántico */
        body {
            background: radial-gradient(circle at top left, #fff1f2 0%, #ffe4e6 45%, #fecdd3 100%);
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* Corazones flotantes de fondo */
        .floating-heart {
            position: absolute;
            pointer-events: none;
            animation: rise linear infinite;
            opacity: 0;
            z-index: 1;
        }

        @keyframes rise {
            0% {
                transform: translateY(105vh) scale(0.5) rotate(0deg);
                opacity: 0;
            }
            15% {
                opacity: 0.75;
            }
            85% {
                opacity: 0.75;
            }
            100% {
                transform: translateY(-15vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* Corazones orbitando alrededor del botón inicial */
        .orbit-heart {
            position: absolute;
            pointer-events: none;
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
        }

        /* Transición suave de la tarjeta de invitación */
        .invitation-card {
            transition: all 0.75s cubic-bezier(0.22, 1, 0.36, 1);
            transform-origin: center center;
        }

        .card-hidden {
            opacity: 0;
            transform: scale(0.75) translateY(30px);
            pointer-events: none;
        }

        .card-visible {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        /* Explosión de corazones al abrir */
        .burst-heart {
            position: fixed;
            pointer-events: none;
            z-index: 50;
            animation: burstOut 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes burstOut {
            0% {
                transform: translate(0, 0) scale(0.4) rotate(0deg);
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(1.3) rotate(var(--rot));
                opacity: 0;
            }
        }

        /* Brillo sutil en el botón */
        .btn-shimmer {
            position: relative;
            overflow: hidden;
        }
        .btn-shimmer::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 40%;
            height: 200%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: rotate(25deg);
            animation: shimmer 3.5s infinite;
        }
        @keyframes shimmer {
            0% { left: -60%; }
            30%, 100% { left: 130%; }
        }

        /* Movimiento suave para el botón travieso "No" */
        #no-btn {
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
    </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center p-4 relative font-sans">

    <!-- Contenedor dinámico para corazones ambientales flotando en el fondo -->
    <div id="ambient-hearts" class="fixed inset-0 pointer-events-none overflow-hidden z-0"></div>

    <!-- ========================================== -->
    <!-- PANTALLA 1: BOTÓN RODEADO DE CORAZONES     -->
    <!-- ========================================== -->
    <div id="button-stage" class="relative z-10 flex flex-col items-center justify-center transition-all duration-500">
        
        <!-- Anillo de corazones decorativos rodeando el botón -->
        <div id="ring-hearts-container" class="relative flex items-center justify-center w-72 h-72 sm:w-80 sm:h-80">
            
            <!-- Corazones posicionados alrededor del botón -->
            <span class="orbit-heart text-2xl sm:text-3xl animate-float" style="top: 4%; left: 46%; animation-delay: 0s;">❤️</span>
            <span class="orbit-heart text-xl sm:text-2xl animate-float" style="top: 14%; left: 76%; animation-delay: 0.5s;">💕</span>
            <span class="orbit-heart text-2xl sm:text-3xl animate-float" style="top: 44%; right: 2%; animation-delay: 1s;">💖</span>
            <span class="orbit-heart text-xl sm:text-2xl animate-float" style="bottom: 14%; left: 76%; animation-delay: 1.5s;">💗</span>
            <span class="orbit-heart text-2xl sm:text-3xl animate-float" style="bottom: 4%; left: 46%; animation-delay: 2s;">❤️</span>
            <span class="orbit-heart text-xl sm:text-2xl animate-float" style="bottom: 14%; left: 14%; animation-delay: 2.5s;">💓</span>
            <span class="orbit-heart text-2xl sm:text-3xl animate-float" style="top: 44%; left: 2%; animation-delay: 3s;">💘</span>
            <span class="orbit-heart text-xl sm:text-2xl animate-float" style="top: 14%; left: 14%; animation-delay: 3.5s;">💝</span>
            
            <!-- Corazoncitos extra más pequeños para mayor ternura -->
            <span class="orbit-heart text-sm sm:text-base animate-pulse" style="top: 8%; left: 30%;">🩷</span>
            <span class="orbit-heart text-sm sm:text-base animate-pulse" style="top: 8%; right: 30%; animation-delay: 0.7s;">🩷</span>
            <span class="orbit-heart text-sm sm:text-base animate-pulse" style="bottom: 8%; left: 30%; animation-delay: 1.2s;">🩷</span>
            <span class="orbit-heart text-sm sm:text-base animate-pulse" style="bottom: 8%; right: 30%; animation-delay: 1.8s;">🩷</span>

            <!-- Botón Principal -->
            <button 
                id="open-btn"
                type="button"
                aria-label="Abrir invitación"
                class="btn-shimmer group relative z-20 flex items-center justify-center gap-3 px-8 py-5 sm:px-9 sm:py-5 rounded-full bg-gradient-to-r from-rose-500 via-pink-500 to-red-500 text-white font-bold text-lg sm:text-xl shadow-[0_12px_35px_rgba(244,63,94,0.45)] hover:shadow-[0_16px_45px_rgba(244,63,94,0.65)] hover:scale-105 active:scale-95 transition-all duration-300 border-2 border-white/60 animate-heartbeat cursor-pointer"
            >
                <svg class="w-6 h-6 text-rose-100 group-hover:rotate-12 transition-transform duration-300" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
                <span class="tracking-wide drop-shadow-sm">Abrir invitación</span>
            </button>
        </div>

        <p class="mt-2 text-rose-700/80 text-sm font-medium animate-pulse">
            Toca el botón para descubrir tu sorpresa ✨
        </p>
    </div>

    <!-- ========================================== -->
    <!-- PANTALLA 2: TARJETA DE INVITACIÓN ABIERTA  -->
    <!-- ========================================== -->
    <main id="invitation-stage" class="invitation-card card-hidden fixed inset-0 z-20 flex items-center justify-center p-4 sm:p-6">
        <div class="relative w-full max-w-md bg-white/95 backdrop-blur-md rounded-3xl shadow-[0_20px_60px_rgba(225,29,72,0.22)] border-2 border-rose-200/80 p-6 sm:p-9 text-center overflow-hidden">
            
            <!-- Decoración superior suave -->
            <div class="absolute top-0 left-0 right-0 h-2 bg-gradient-to-r from-rose-400 via-pink-500 to-red-400"></div>
            
            <!-- Corazones flotantes decorativos dentro de la tarjeta -->
            <span class="absolute top-4 left-5 text-rose-300/70 text-xl select-none animate-float">💕</span>
            <span class="absolute top-5 right-5 text-pink-300/70 text-xl select-none animate-float" style="animation-delay: 1s;">💖</span>
            <span class="absolute bottom-14 left-4 text-rose-200/80 text-lg select-none">💗</span>
            <span class="absolute bottom-14 right-4 text-rose-200/80 text-lg select-none">💓</span>

            <!-- Sello superior -->
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-rose-100 text-rose-600 mb-4 shadow-inner border border-rose-200">
                <span class="text-3xl animate-heartbeat">🛁</span>
            </div>

            <!-- Etiqueta superior -->
            <p class="uppercase tracking-[0.18em] text-xs font-extrabold text-rose-600 mb-2">
                Invitación Exclusiva
            </p>
